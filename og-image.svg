<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a18"/>
      <stop offset="50%" stop-color="#201a2a"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b6fd4"/>
      <stop offset="100%" stop-color="#e0a84a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent line -->
  <rect x="140" y="200" width="180" height="6" rx="3" fill="url(#accent)"/>

  <!-- Title -->
  <text x="140" y="180" font-family="sans-serif" font-size="72" font-weight="800" fill="#e0dcd0">
    Enshrouded<tspan fill="#e0a84a">Guides</tspan>
  </text>

  <!-- Tagline -->
  <text x="140" y="280" font-family="sans-serif" font-size="28" fill="#a8a498">
    Player-tested skill tier lists, weapon rankings, boss strategies &amp; base building guides.
  </text>

  <!-- Features row -->
  <text x="140" y="390" font-family="sans-serif" font-size="22" fill="#7a7668">
    ⭐ Best Skills &amp; Weapons  ·  💀 Boss Walkthroughs  ·  🏠 Base Building  ·  📖 Beginner Guide
  </text>

  <!-- Bottom accent -->
  <rect x="140" y="460" width="920" height="1" fill="#3d3d38"/>

  <!-- Footer text -->
  <text x="140" y="510" font-family="sans-serif" font-size="18" fill="#7a7668">
    Updated for 2026 — Preparing for the 1.0 launch.
  </text>
  <text x="140" y="545" font-family="sans-serif" font-size="16" fill="#5f5b54">
    enshroudedguides.com
  </text>
</svg>
